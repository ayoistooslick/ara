[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-companion"
version = "0.1.0"
description = "A local-first conversational companion with persistent memory and bounded tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ayodele Ayokunle David"}]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
ara = "ara.cli:main"

[tool.setuptools.packages.find]
include = ["ara*"]
