[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-companion"
version = "0.5.0"
description = "Àrà: a web-first Nigerian AI powered by ara-ng, with memory, Nigerian-context knowledge, source-attributed news, and honest fallbacks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayodele Ayokunle David" }]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["tomli>=1.1.0; python_version < '3.11'"]
train = ["tomli>=1.1.0; python_version < '3.11'"]

[project.scripts]
ara = "ara.cli:main"

[project.urls]
Repository = "https://github.com/ayoistooslick/ara"

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.setuptools.package-data]
ara = ["data/nigeria/*.json", "web/static/*", "web/static/*/*"]
